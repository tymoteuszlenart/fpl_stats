name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff format check
        run: ruff format --check .

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Prettier
        run: npm ci

      - name: Prettier check
        run: npm run format:check

      - name: Syntax check (py_compile)
        run: |
          python -m py_compile \
            fpl_generate_report_v3.py \
            fetch_fpl_league_data.py \
            map_players_name.py \
            fpl_stats/__init__.py \
            fpl_stats/api.py \
            fpl_stats/aggregates.py \
            fpl_stats/awards.py \
            fpl_stats/chips.py \
            fpl_stats/data_loader.py \
            fpl_stats/fetcher.py \
            fpl_stats/report.py \
            fpl_stats/season_storage.py

      - name: Run pytest
        run: |
          # bash -e (GitHub Actions default) exits before $? if pytest fails; use || to capture.
          code=0
          python -m pytest -q || code=$?
          if [ "$code" -eq 5 ]; then
            echo "No tests collected yet; pytest will run the suite once test/ exists."
            exit 0
          fi
          exit "$code"
